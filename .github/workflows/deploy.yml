name: Auto Update SW Cache

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-sw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update sw.js Cache Key
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          sed -i "s/__BUILD_HASH__/$SHORT_HASH/g" sw.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "chore: auto-update sw.js cache key" || exit 0
          git push